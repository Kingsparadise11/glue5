# Builds one platform from game.wasm in the existing draft release.
name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options:
          - ios
          - android
          - windows
          - macos
          - linux-x86_64
          - linux-aarch64
        default: ios

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.platform }}

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ fromJSON('{"ios":"macos-15","macos":"macos-15","android":"ubuntu-24.04","linux-x86_64":"ubuntu-24.04","linux-aarch64":"ubuntu-24.04-arm","windows":"windows-2025"}')[inputs.platform] }}
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_PLATFORM: ${{ inputs.platform }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Check fork status
        continue-on-error: true
        run: |
          parent=$(gh api "repos/$GITHUB_REPOSITORY" \
            --jq '.parent | select(.) | .full_name + " " + .default_branch')

          [ -n "$parent" ] || exit 0

          read -r name branch <<< "$parent"

          behind=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...${name%%/*}:$branch" \
            --jq '.ahead_by')

          if [ "${behind:-0}" -gt 0 ]; then
            echo "::warning::This copy is $behind commits behind $name. Consider syncing the fork."
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch game.wasm from the draft release
        id: game
        run: |
          game="$RUNNER_TEMP/game"

          if [ "$RUNNER_OS" = "Windows" ]; then
            game=$(cygpath -m "$game")
          fi

          .github/scripts/draft.sh fetch "$game"

          echo "GLUE5_GAME_DIR=$game" >> "$GITHUB_ENV"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Windows C compiler and linker
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # ------------------------------------------------------------------
          # ROOT-CAUSE FIX for:
          #   linking with `link.exe` failed ... "C:\Program Files\Git\usr\bin\link.exe"
          #   /usr/bin/link: extra operand ...
          #
          # Git for Windows ships a GNU coreutils `link.exe` that shadows
          # Microsoft's linker. Every bash shell (including the ones mise
          # spawns, and the nested cargo build that glue5-mods/build.rs starts
          # for glue5-studio) puts Git's usr/bin at the FRONT of PATH, so no
          # amount of PATH / env-var juggling reliably wins. Remove it.
          # ------------------------------------------------------------------
          git_link=$(cygpath -u 'C:\Program Files\Git\usr\bin\link.exe')
          if [ -f "$git_link" ]; then
            echo "Removing Git's GNU link.exe: $git_link"
            rm -f "$git_link"
          fi
          rm -f /usr/bin/link.exe 2>/dev/null || true

          # Use Git for Windows Bash for mise tasks.
          echo "MISE_BASH_PATH=$(cygpath -w /)bin\\bash.exe" >> "$GITHUB_ENV"

          vswhere=$(cygpath -u 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe')

          if [ ! -f "$vswhere" ]; then
            echo "::error::Visual Studio Installer vswhere.exe was not found."
            exit 1
          fi

          vs_install=$(
            "$vswhere" -latest -products '*' \
              -property installationPath 2>/dev/null | tr -d '\r'
          )

          if [ -z "$vs_install" ]; then
            echo "::error::No Visual Studio installation was found."
            exit 1
          fi

          msvc_root="$(cygpath -u "$vs_install")/VC/Tools/MSVC"

          if [ ! -d "$msvc_root" ]; then
            echo "::error::MSVC tools directory was not found: $msvc_root"
            exit 1
          fi

          # Locate the real Microsoft x64 linker.
          link_unix=$(
            find "$msvc_root" \
              -type f \
              -path '*/bin/Hostx64/x64/link.exe' \
              -print 2>/dev/null |
              sort -V |
              tail -n 1
          )

          if [ -z "$link_unix" ] || [ ! -f "$link_unix" ]; then
            echo "::error::MSVC x64 linker was not found."
            exit 1
          fi

          link_win=$(cygpath -w "$link_unix")
          link_dir_win=$(cygpath -w "$(dirname "$link_unix")")

          # Explicitly configure Cargo to use Microsoft's linker.
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link_win" >> "$GITHUB_ENV"

          # Also place the MSVC linker directory on the PATH.
          echo "$link_dir_win" >> "$GITHUB_PATH"

          # Find standalone LLVM's clang-cl first.
          clang_win='C:\Program Files\LLVM\bin\clang-cl.exe'

          if [ ! -f "$(cygpath -u "$clang_win")" ]; then
            # Otherwise find the LLVM copy bundled with Visual Studio.
            clang_win=$(
              "$vswhere" -latest -products '*' \
                -find 'VC\Tools\Llvm\x64\bin\clang-cl.exe' \
                2>/dev/null | tr -d '\r' | head -n 1
            )

            if [ -z "$clang_win" ] ||
               [ ! -f "$(cygpath -u "$clang_win")" ]; then
              clang_win=""
            fi
          fi

          # Install LLVM only if neither existing location has clang-cl.
          if [ -z "$clang_win" ]; then
            echo "clang-cl was not found. Installing LLVM..."

            choco install llvm --yes --no-progress

            clang_win='C:\Program Files\LLVM\bin\clang-cl.exe'
          fi

          clang_unix=$(cygpath -u "$clang_win")

          if [ ! -f "$clang_unix" ]; then
            echo "::error::clang-cl.exe was not found after LLVM setup."
            exit 1
          fi

          clang_dir_win=$(cygpath -w "$(dirname "$clang_unix")")
          echo "$clang_dir_win" >> "$GITHUB_PATH"

          # Glue5's build script uses this target-specific variable.
          # Give cc-rs the complete compiler path so it doesn't depend
          # on finding "clang-cl" through PATH during the Cargo build.
          echo "CC_x86_64_pc_windows_msvc=$clang_win" >> "$GITHUB_ENV"

          echo "MSVC linker: $link_win"
          echo "Clang compiler: $clang_win"

          # Validate both tools without running LINK /?.
          test -f "$link_unix"
          "$clang_unix" --version

      - name: Set up Xcode 26
        if: runner.os == 'macOS'
        run: |
          xcode=$(
            ls -d /Applications/Xcode_26*.app 2>/dev/null |
            grep -E '/Xcode_26(\.[0-9]+)*\.app$' |
            sort -V |
            tail -n 1 || true
          )

          if [ -z "$xcode" ]; then
            echo "::error::Xcode 26 was not found on this runner."
            exit 1
          fi

          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

      - name: Install build tools with mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.7.5
          install: ${{ !startsWith(inputs.platform, 'linux') }}
          install_args: ${{ fromJSON('{"ios":"rust cmake xcodegen","macos":"rust cmake cargo:cargo-packager","android":"rust cmake java gradle android-sdk cargo:cargo-ndk","windows":"rust cmake"}')[inputs.platform] }}
          cache_key_prefix: mise-${{ inputs.platform }}

      - name: Set up Android signing key
        if: inputs.platform == 'android'
        run: |
          yes | mise exec -- sdkmanager --licenses >/dev/null || true

          mkdir -p "$HOME/.android"
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"

          cd "$HOME/.android"

          "$GITHUB_WORKSPACE/.github/scripts/draft.sh" get \
            "${{ steps.game.outputs.release }}" Glue5-android.keystore

          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            mise -C "$GITHUB_WORKSPACE" exec -- keytool -genkeypair \
              -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Patch glue5-runtime type inference error (Windows)
        if: runner.os == 'Windows'
        run: |
          # On Windows, give_back() in memory.rs only does `let _ = ptr;`, so
          # nothing tells rustc what `.cast()` should produce:
          #   error[E0282]: type annotations needed for `*mut _`
          # Annotating the type fixes it. This is a no-op once the source
          # already has the annotation (e.g. after you commit the fix or
          # sync your fork), so it is safe to leave in.
          file=crates/glue5-runtime/src/memory.rs

          if grep -q 'let ptr = mem.ptr(first \* page_size()).cast();' "$file"; then
            sed -i 's|let ptr = mem.ptr(first \* page_size()).cast();|let ptr: *mut std::ffi::c_void = mem.ptr(first * page_size()).cast();|' "$file"
            echo "Patched $file"
            grep -n 'let ptr: \*mut std::ffi::c_void' "$file"
          else
            echo "No patch needed for $file"
          fi

      - name: Build
        run: |
          echo "Building platform: $BUILD_PLATFORM"

          case "$BUILD_PLATFORM" in
            ios)
              mise run ios:ipa
              mv target/ios/Glue5.ipa Glue5-ios.ipa
              ;;

            windows)
              # Confirm the target-specific compiler setting reached this step.
              if [ -z "${CC_x86_64_pc_windows_msvc:-}" ]; then
                echo "::error::CC_x86_64_pc_windows_msvc is not set."
                exit 1
              fi

              clang_path=$(cygpath -u "$CC_x86_64_pc_windows_msvc")

              if [ ! -f "$clang_path" ]; then
                echo "::error::Configured clang-cl.exe does not exist: $CC_x86_64_pc_windows_msvc"
                exit 1
              fi

              echo "Using C compiler: $CC_x86_64_pc_windows_msvc"
              "$clang_path" --version

              if [ -z "${CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER:-}" ]; then
                echo "::error::MSVC linker configuration is missing."
                exit 1
              fi

              echo "Using MSVC linker: $CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"

              # Put Microsoft's linker directory first on PATH and make sure
              # a bare `link.exe` can no longer resolve to Git's GNU `link`.
              msvc_link_unix=$(cygpath -u "$CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER")
              export PATH="$(dirname "$msvc_link_unix"):$PATH"

              resolved_link=$(command -v link.exe || true)
              echo "link.exe resolves to: ${resolved_link:-<none>}"

              case "$resolved_link" in
                */Git/usr/bin/*|*/usr/bin/link.exe)
                  echo "::error::link.exe still resolves to Git's GNU link: $resolved_link"
                  exit 1
                  ;;
              esac

              mise run build

              if [ ! -f target/release/glue5.exe ]; then
                echo "::error::target/release/glue5.exe was not produced."
                exit 1
              fi

              mv target/release/glue5.exe Glue5-windows.exe
              ;;

            macos)
              mise run macos:package
              mv target/package/*.dmg Glue5-macos.dmg
              ;;

            android)
              mise run android:build
              mv target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android.apk
              cp "$HOME/.android/debug.keystore" Glue5-android.keystore
              ;;

            linux-*)
              mise run linux:container "${BUILD_PLATFORM#linux-}"
              mv target/package/*.AppImage "Glue5-$BUILD_PLATFORM.AppImage"
              ;;

            *)
              echo "::error::Unsupported platform: $BUILD_PLATFORM"
              exit 1
              ;;
          esac

      - name: Upload files to the draft release
        run: |
          .github/scripts/draft.sh upload \
            "${{ steps.game.outputs.release }}" Glue5-*

          echo "Built platform: $BUILD_PLATFORM" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated files were uploaded to the draft release." >> "$GITHUB_STEP_SUMMARY"


name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options:
          - ios
          - android
          - windows
          - macos
          - linux-x86_64
          - linux-aarch64
        default: ios

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.platform }}

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ fromJSON('{"ios":"macos-15","android":"ubuntu-24.04","windows":"windows-2025","macos":"macos-15","linux-x86_64":"ubuntu-24.04","linux-aarch64":"ubuntu-24.04-arm"}')[inputs.platform] }}
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_PLATFORM: ${{ inputs.platform }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Check fork status
        continue-on-error: true
        run: |
          parent=$(gh api "repos/$GITHUB_REPOSITORY" \
            --jq '.parent | select(.) | .full_name + " " + .default_branch')

          if [ -z "$parent" ]; then
            echo "No parent repository detected."
            exit 0
          fi

          read -r name branch <<< "$parent"

          behind=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...${name%%/*}:$branch" \
            --jq '.ahead_by')

          if [ "${behind:-0}" -gt 0 ]; then
            echo "::warning::This fork is $behind commits behind $name. Consider syncing it."
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch game.wasm from the draft release
        id: game
        run: |
          game="$RUNNER_TEMP/game"

          if [ "$RUNNER_OS" = "Windows" ]; then
            game=$(cygpath -m "$game")
          fi

          .github/scripts/draft.sh fetch "$game"

          echo "GLUE5_GAME_DIR=$game" >> "$GITHUB_ENV"

      # Set up the Visual Studio C++ compiler environment.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Configure tools without running LINK /?, which exits with code 76.
      - name: Configure Windows compiler and linker
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'MISE_BASH_PATH=C:\Program Files\Git\bin\bash.exe' >> "$GITHUB_ENV"

          vswhere=$(cygpath -u 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe')

          if [ ! -f "$vswhere" ]; then
            echo "::error::Visual Studio Installer vswhere.exe was not found."
            exit 1
          fi

          vs_install=$(
            "$vswhere" -latest -products '*' \
              -property installationPath 2>/dev/null | tr -d '\r'
          )

          if [ -z "$vs_install" ]; then
            echo "::error::No Visual Studio installation was found."
            exit 1
          fi

          msvc_root="$(cygpath -u "$vs_install")/VC/Tools/MSVC"

          if [ ! -d "$msvc_root" ]; then
            echo "::error::MSVC tools directory was not found: $msvc_root"
            exit 1
          fi

          # Find Microsoft's real x64 linker.
          link_unix=$(
            find "$msvc_root" \
              -type f \
              -path '*/bin/Hostx64/x64/link.exe' \
              -print 2>/dev/null |
              sort -V |
              tail -n 1
          )

          if [ -z "$link_unix" ] || [ ! -f "$link_unix" ]; then
            echo "::error::Microsoft's x64 link.exe was not found."
            exit 1
          fi

          link_win=$(cygpath -w "$link_unix")
          link_dir_win=$(cygpath -w "$(dirname "$link_unix")")

          # Force Cargo to use Microsoft's linker instead of Git's link.exe.
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link_win" >> "$GITHUB_ENV"

          # Make the MSVC linker directory available to later steps.
          echo "$link_dir_win" >> "$GITHUB_PATH"

          # First check standalone LLVM.
          clang_win='C:\Program Files\LLVM\bin\clang-cl.exe'

          if [ ! -f "$(cygpath -u "$clang_win")" ]; then
            # Then check LLVM bundled with Visual Studio.
            clang_win=$(
              "$vswhere" -latest -products '*' \
                -find 'VC\Tools\Llvm\x64\bin\clang-cl.exe' \
                2>/dev/null | tr -d '\r' | head -n 1
            )

            if [ -z "$clang_win" ] ||
               [ ! -f "$(cygpath -u "$clang_win")" ]; then
              clang_win=""
            fi
          fi

          # Install LLVM if clang-cl is not already available.
          if [ -z "$clang_win" ]; then
            echo "Installing LLVM..."
            choco install llvm --yes --no-progress

            clang_win='C:\Program Files\LLVM\bin\clang-cl.exe'
          fi

          clang_unix=$(cygpath -u "$clang_win")

          if [ ! -f "$clang_unix" ]; then
            echo "::error::clang-cl.exe was not found."
            exit 1
          fi

          clang_dir_win=$(cygpath -w "$(dirname "$clang_unix")")
          echo "$clang_dir_win" >> "$GITHUB_PATH"

          echo "MSVC linker: $link_win"
          echo "Clang compiler: $clang_win"
          echo "Cargo linker override: $CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"

          # Validate the linker file without invoking its help command.
          test -f "$link_unix"

          # Check that Clang executes successfully.
          "$clang_unix" --version

      - name: Set up Xcode 26
        if: runner.os == 'macOS'
        run: |
          xcode=$(
            ls -d /Applications/Xcode_26*.app 2>/dev/null |
            grep -E '/Xcode_26(\.[0-9]+)*\.app$' |
            sort -V |
            tail -n 1 || true
          )

          if [ -z "$xcode" ]; then
            echo "::error::Xcode 26 was not found on this runner."
            exit 1
          fi

          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

      - name: Install build tools with mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.7.5
          install: ${{ !startsWith(inputs.platform, 'linux') }}
          install_args: ${{ fromJSON('{"ios":"rust cmake xcodegen","macos":"rust cmake cargo:cargo-packager","android":"rust cmake java gradle android-sdk cargo:cargo-ndk","windows":"rust cmake"}')[inputs.platform] }}
          cache_key_prefix: mise-${{ inputs.platform }}

      - name: Set up Android signing key
        if: inputs.platform == 'android'
        run: |
          yes | mise exec -- sdkmanager --licenses >/dev/null || true

          mkdir -p "$HOME/.android"
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"

          cd "$HOME/.android"

          . "$GITHUB_WORKSPACE/.github/scripts/draft.sh" get \
            "${{ steps.game.outputs.release }}" Glue5-android.keystore

          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            mise -C "$GITHUB_WORKSPACE" exec -- keytool -genkeypair \
              -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build
        run: |
          echo "Building platform: $BUILD_PLATFORM"

          case "$BUILD_PLATFORM" in
            ios)
              mise run ios:ipa
              mv target/ios/Glue5.ipa Glue5-ios.ipa
              ;;

            windows)
              # Confirm Cargo has the explicit Microsoft linker setting.
              if [ -z "${CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER:-}" ]; then
                echo "::error::The MSVC linker override is missing."
                exit 1
              fi

              echo "Using MSVC linker: $CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"

              mise run build

              if [ ! -f target/release/glue5.exe ]; then
                echo "::error::The build completed without producing target/release/glue5.exe."
                echo "Inspect the build output above for the actual compilation error."
                exit 1
              fi

              mv target/release/glue5.exe Glue5-windows.exe
              ;;

            macos)
              mise run macos:package
              mv target/package/*.dmg Glue5-macos.dmg
              ;;

            android)
              mise run android:build
              mv target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android.apk
              cp "$HOME/.android/debug.keystore" Glue5-android.keystore
              ;;

            linux-*)
              mise run linux:container "${BUILD_PLATFORM#linux-}"
              mv target/package/*.AppImage "Glue5-$BUILD_PLATFORM.AppImage"
              ;;

            *)
              echo "::error::Unsupported platform: $BUILD_PLATFORM"
              exit 1
              ;;
          esac

      - name: Upload files to the draft release
        run: |
          .github/scripts/draft.sh upload \
            "${{ steps.game.outputs.release }}" Glue5-*

          echo "Build platform: $BUILD_PLATFORM" >> "$GITHUB_STEP_SUMMARY"
          echo "The generated files were uploaded to the draft release." >> "$GITHUB_STEP_SUMMARY"

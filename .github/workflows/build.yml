
name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [ios, android, windows, macos, linux-x86_64, linux-aarch64]
        default: ios

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.platform }}

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ fromJSON('{"ios":"macos-15","macos":"macos-15","android":"ubuntu-24.04","linux-x86_64":"ubuntu-24.04","linux-aarch64":"ubuntu-24.04-arm","windows":"windows-2025"}')[inputs.platform] }}
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_PLATFORM: ${{ inputs.platform }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Up to date
        continue-on-error: true
        run: |
          parent=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent | select(.) | .full_name + " " + .default_branch')
          [ -n "$parent" ] || exit 0
          read -r name branch <<<"$parent"
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...${name%%/*}:$branch" --jq .ahead_by)
          if [ "${behind:-0}" -gt 0 ]; then
              echo "::warning::This copy is $behind commits behind $name. Sync your fork and update the branch."
          fi

      - uses: actions/checkout@v5

      - name: game.wasm from the draft release
        id: game
        run: |
          game=$RUNNER_TEMP/game
          if [ "$RUNNER_OS" = Windows ]; then
              game=$(cygpath -m "$game")
          fi
          .github/scripts/draft.sh fetch "$game"
          echo "GLUE5_GAME_DIR=$game" >> "$GITHUB_ENV"

      # Configure MSVC without using the reserved PLATFORM variable.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Find clang-cl or install LLVM if it is missing.
      - name: Git Bash and clang-cl
        if: runner.os == 'Windows'
        run: |
          echo "MISE_BASH_PATH=$(cygpath -w /)bin\\bash.exe" >> "$GITHUB_ENV"

          find_clang() {
              local candidate
              local vswhere

              candidate=$(command -v clang-cl.exe 2>/dev/null || true)
              if [ -n "$candidate" ]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi

              candidate='C:\Program Files\LLVM\bin\clang-cl.exe'
              if [ -f "$(cygpath -u "$candidate")" ]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi

              vswhere=$(cygpath -u 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe')

              if [ -f "$vswhere" ]; then
                  candidate=$("$vswhere" -latest -products '*' \
                      -find 'VC\Tools\Llvm\**\bin\clang-cl.exe' 2>/dev/null \
                      | tr -d '\r' | head -n 1)

                  if [ -n "$candidate" ] && [ -f "$(cygpath -u "$candidate")" ]; then
                      printf '%s\n' "$candidate"
                      return 0
                  fi
              fi

              return 1
          }

          clang=$(find_clang || true)

          if [ -z "$clang" ]; then
              echo "clang-cl not found. Installing LLVM..."
              choco install llvm --yes --no-progress

              clang='C:\Program Files\LLVM\bin\clang-cl.exe'

              if [ ! -f "$(cygpath -u "$clang")" ]; then
                  echo "::error::LLVM installed, but clang-cl.exe was not found."
                  exit 1
              fi
          fi

          clang_dir=$(dirname "$clang")
          clang_dir_unix=$(cygpath -u "$clang_dir")

          echo "$clang_dir" >> "$GITHUB_PATH"
          export PATH="$clang_dir_unix:$PATH"

          echo "Using compiler: $clang"
          clang-cl.exe --version

      - name: Xcode 26
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null \
              | grep -E '/Xcode_26(\.[0-9]+)*\.app$' \
              | sort -V | tail -n 1 || true)

          if [ -z "$xcode" ]; then
              echo "::error::No Xcode 26 found on this runner."
              exit 1
          fi

          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Room on the disk
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.7.5
          install: ${{ !startsWith(inputs.platform, 'linux') }}
          install_args: ${{ fromJSON('{"ios":"rust cmake xcodegen","macos":"rust cmake cargo:cargo-packager","android":"rust cmake java gradle android-sdk cargo:cargo-ndk","windows":"rust cmake"}')[inputs.platform] }}
          cache_key_prefix: mise-${{ inputs.platform }}

      - name: Android signing key
        if: inputs.platform == 'android'
        run: |
          yes | mise exec -- sdkmanager --licenses >/dev/null || true
          mkdir -p ~/.android
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"

          cd ~/.android
          "$GITHUB_WORKSPACE/.github/scripts/draft.sh" get \
              "${{ steps.game.outputs.release }}" Glue5-android.keystore

          if [ -f Glue5-android.keystore ]; then
              mv Glue5-android.keystore debug.keystore
          else
              mise -C "$GITHUB_WORKSPACE" exec -- keytool -genkeypair \
                  -noprompt -keystore debug.keystore \
                  -storepass android -keypass android \
                  -alias androiddebugkey -keyalg RSA \
                  -keysize 2048 -validity 10000 \
                  -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build
        run: |
          echo "Building platform: $BUILD_PLATFORM"

          case "$BUILD_PLATFORM" in
          ios)
              mise run ios:ipa
              mv target/ios/Glue5.ipa Glue5-ios.ipa
              ;;
          windows)
              clang-cl.exe --version
              mise run build
              mv target/release/glue5.exe Glue5-windows.exe
              ;;
          macos)
              mise run macos:package
              mv target/package/*.dmg Glue5-macos.dmg
              ;;
          android)
              mise run android:build
              mv target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android.apk
              cp ~/.android/debug.keystore Glue5-android.keystore
              ;;
          linux-*)
              mise run linux:container "${BUILD_PLATFORM#linux-}"
              mv target/package/*.AppImage "Glue5-$BUILD_PLATFORM.AppImage"
              ;;
          *)
              echo "::error::Unsupported platform: $BUILD_PLATFORM"
              exit 1
              ;;
          esac

      - name: Into the draft release
        run: |
          .github/scripts/draft.sh upload "${{ steps.game.outputs.release }}" Glue5-*
          echo "Built for $BUILD_PLATFORM: the files are in the draft release, under $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases (keep it a draft)." >> "$GITHUB_STEP_SUMMARY"
